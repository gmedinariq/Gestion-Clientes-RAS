# nginx sirve la web y hace de "proxy" hacia la API.
# Así navegador, web y API comparten origen (http://localhost:8085): la cookie de sesión
# funciona sin configurar CORS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Peticiones a la API -> contenedor "api" (nombre del servicio en docker-compose.yml)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicación React (SPA): cualquier otra ruta devuelve index.html y React Router decide qué mostrar
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy same-origin;
    }
}
